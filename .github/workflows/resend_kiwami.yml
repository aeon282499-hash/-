name: 極み再配信（手動）

# 2026-09-02 本人依頼「売買シグナル再配信できる？新バージョンでばれない奴」で新設。
# その時点のHEADの文面ロジックで、当日分の極み買い/売りを再送するだけの手動専用ジョブ。
# 台帳・JSONには一切書かない（shadow_exitのsend関数は読むだけ）。コミットもしない。
# 定期実行なし＝workflow_dispatchのみ。送信済みガードは意図的に通らない（再送が目的）。
#
# target=check は全Discord webhookの生死診断（GET＝投稿しない）。2026-09-02の
# 「チャンネル複製→元ch削除でwebhook全滅」事故の被害確定用。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "buy / sell / both / check（既定buy＝売りは0件日が多くノイズになるため）"
        required: false
        default: "buy"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_SHADOW_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_URL }}
      DISCORD_WEBHOOK_SHADOW_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SMALL_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL }}
      # ↓target=checkの生死診断だけで使う（再送では触らない）
      DISCORD_WEBHOOK_SHADOW_MONTHLY_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MONTHLY_URL }}
      DISCORD_WEBHOOK_SHADOW_WEEKLY_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_WEEKLY_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_URL }}
      DISCORD_WEBHOOK_BUY_MID_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_MID_URL }}
      DISCORD_WEBHOOK_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_MID_URL }}
      DISCORD_WEBHOOK_BUY_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_SMALL_URL }}
      DISCORD_WEBHOOK_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_SMALL_URL }}
      DISCORD_WEBHOOK_DAY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_URL }}
      DISCORD_WEBHOOK_URL_DAY: ${{ secrets.DISCORD_WEBHOOK_URL_DAY }}
      DISCORD_WEBHOOK_DAY_FRIENDS_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_FRIENDS_URL }}
      DISCORD_WEBHOOK_DAY_MONTHLY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_MONTHLY_URL }}
      DISCORD_WEBHOOK_EARNINGS_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_URL }}
      DISCORD_WEBHOOK_EARNINGS_MID_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_MID_URL }}
      DISCORD_WEBHOOK_EARNINGS_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_SMALL_URL }}
      DISCORD_WEBHOOK_PEAD_URL: ${{ secrets.DISCORD_WEBHOOK_PEAD_URL }}
      DISCORD_WEBHOOK_GAPFADE_URL: ${{ secrets.DISCORD_WEBHOOK_GAPFADE_URL }}
      DISCORD_WEBHOOK_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_URL_PUBLIC }}
      DISCORD_WEBHOOK_SELL_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_SELL_URL_PUBLIC }}
      DISCORD_WEBHOOK_CLOSE_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_CLOSE_URL_PUBLIC }}
      DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC }}
      DISCORD_WEBHOOK_URL_SECTOR_THEME: ${{ secrets.DISCORD_WEBHOOK_URL_SECTOR_THEME }}
      DISCORD_WEBHOOK_URL_SECTOR_THEME_SELL: ${{ secrets.DISCORD_WEBHOOK_URL_SECTOR_THEME_SELL }}
      DISCORD_WEBHOOK_URL_THEME: ${{ secrets.DISCORD_WEBHOOK_URL_THEME }}
      DISCORD_WEBHOOK_URL_1570: ${{ secrets.DISCORD_WEBHOOK_URL_1570 }}
      DISCORD_WEBHOOK_URL_PREMIUM: ${{ secrets.DISCORD_WEBHOOK_URL_PREMIUM }}
      DISCORD_WEBHOOK_TEST_URL: ${{ secrets.DISCORD_WEBHOOK_TEST_URL }}
      KABUAI_DISCORD_WEBHOOK: ${{ secrets.KABUAI_DISCORD_WEBHOOK }}
      TARGET: ${{ inputs.target }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}   # target=fadeの再計算で使用
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 極み再送（当日JST分・読むだけ）
        run: |
          python -X utf8 -c "
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import shadow_exit as se
          today = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          target = (os.getenv('TARGET') or 'buy').strip().lower()
          if target == 'check':
              # webhookの生死診断: GETは投稿せずname/channel_idが返る（トークンは出さない）
              import requests
              envs = sorted(k for k in os.environ if 'DISCORD' in k and 'WEBHOOK' in k)
              for env in envs:
                  u = os.getenv(env, '').strip()
                  if not u:
                      print(f'{env:45s}: 未設定'); continue
                  try:
                      r = requests.get(u, timeout=10)
                  except Exception as e:
                      print(f'{env:45s}: ERROR {e}'); continue
                  if r.status_code == 200:
                      j = r.json()
                      print(f'{env:45s}: 200 name={j.get(\"name\")} channel={j.get(\"channel_id\")}')
                  else:
                      print(f'{env:45s}: {r.status_code}')
              raise SystemExit(0)
          if target == 'fade':
              # フェード再送: 当日分を再計算して配信だけやり直す。settle/record/save_bookは
              # 呼ばない＝台帳・日付ガード無変更（朝8:05便が既に記帳済みの前提）。
              import daytrade_paper as dp
              data = dp._fetch_all(today)
              tok = dp._jq_token()
              iss = dp.fetch_iss_map(tok)
              dp._LAST_ISS = iss
              ratio = dp.fetch_ratio_map(tok)
              alert = dp.fetch_alert_map(tok)
              banned = []
              picks = dp.daily_top_fades(data, today, iss, ratio_map=ratio,
                                         alert_map=alert, excluded_out=banned)
              stats = dp.cumulative_stats(dp.load_book())
              dp.send_report([], [], picks, stats, today, dry=False, banned=banned)
              print('fade resend done / picks:', [(p.get(\"ticker\"), p.get(\"verdict\")) for p in picks])
              raise SystemExit(0)
          for key in se.NOTIFY_KEYS:
              if target in ('both', 'buy'):
                  print(key, 'buy  ->', se.send_discord(today, key))
              if target in ('both', 'sell'):
                  print(key, 'sell ->', se.send_discord_sell(today, key))
          "
