name: 銘柄選別だけ通知（screen-only・⛔定期配信停止 2026-10-20）

# 「銘柄選別だけ」の Discord 通知。売買の判断・自動発注は一切しない（候補リストを出すだけ）。
#   08:30 JST ① 今日の候補（押し目買い用・5日−5%以上）＋ ② ショート候補（参考・5日+5%以上）
#   09:35 JST ③ ①の絞り込み（×見送り / ◎注目 / ○）… Yahoo 5分足は約20分遅延なので
#              9:30までの足が出揃うまでスクリプト内で待つ（最大 SCREEN_WAIT_MAX_MIN 分）
# 祝日・休場日は kabuai/screen_only.py が market_calendar.csv(HolDiv 1/2のみ営業日・3=祝日取引は現物休場) で判定して何も送らない。
# 通知先は Secrets の DISCORD_WEBHOOK_SCREEN_URL（URL はコード/ログに出さない）。
# ※ GitHub cron は数分〜数十分遅延することがある（保険が要るなら cron-job.org→Worker 経路を併用）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "morning=①②（8:30） / update=③（9:35） / auto=JST時刻で自動"
        type: choice
        options: [auto, morning, update]
        default: auto
      date:
        description: "リプレイ日 YYYY-MM-DD（空=今日）。過去日は 5分足が Yahoo に残る直近60日まで"
        required: false
        default: ""
      dry_run:
        description: "true=Discordに送らずログに表示だけ"
        type: boolean
        default: false
  # ⛔ 2026-10-20 本人「これ配信いらない 儲からない」で定期配信を停止（60日再生で押し目ルールは−0.04%/件 PF0.94＝絞って儲かる証拠なし）。
  #    コードと手動実行(workflow_dispatch)は残置。再開するなら下の2行のコメントを外す。
  # schedule:
  #   - cron: '30 23 * * 0-4'   # UTC 23:30 = JST 翌08:30 平日 → ①②
  #   - cron: '35 0 * * 1-5'    # UTC 00:35 = JST 09:35 平日 → ③

concurrency:
  group: kabuai-screen-${{ github.event_name }}-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      DISCORD_WEBHOOK_SCREEN_URL: ${{ secrets.DISCORD_WEBHOOK_SCREEN_URL }}
      MIN_TURNOVER_OKU: "5"        # 前日売買代金の下限（億円）
      MAX_MCAP_OKU: "1000"         # 時価総額の上限（億円・1000億以上は除外・0で無制限）
      SCREEN_WAIT_MAX_MIN: "25"    # ③で 9:30 足が揃うのを待つ上限（分）
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r kabuai/requirements.txt

      - name: 銘柄選別→Discord
        run: |
          ARGS="--mode ${{ inputs.mode || 'auto' }}"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -X utf8 kabuai/screen_only.py $ARGS
