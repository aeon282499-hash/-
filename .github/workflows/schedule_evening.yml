name: スイング前夜配信

# 2026-08-09 本人依頼「翌営業日の銘柄を前日21時に出して」で新設。
# main.py を EVENING_RUN=1 で回す＝「翌営業日の朝8:05ランの前倒し実行」。
# 株価四本値は当日16:30頃・信用週末残高は火曜16:30頃にJ-Quants公開済み（公式仕様）
# なので、夜21時時点で翌朝ランと同一データ＝同一銘柄・同一帳簿処理になる。
#
# フォールバック設計:
# - 夜ラン成功 → today_signals.json の日付が翌営業日になり、翌朝8:05ランは
#   既存の送信済みガードで自然にスキップ（朝の他ジョブ=デイトレ/PEAD/決算予備は無傷）。
# - 夜ランが失敗/データ未公開/起動せず → 何もコミットされず、翌朝8:05ランが
#   従来どおりフル実行＝配信が消えることはない。
#
# 起動（2026-08-28に21:00→18:50着弾へ前倒し・本人依頼「ハイカラ在庫が19時スタート」）:
# 本命は cron-job.org → Cloudflare Worker `evening-signal-trigger`（18:05 JST・分単位で正確）
# → workflow_dispatch。スイング着弾≒18:35・フェード着弾≒18:45-50 → 19:00のHYPER在庫解禁に間に合う。
# GitHub cron（実測40〜50分遅延・2026-08-27には全本無発火の夜あり）は保険に格下げ。
# 二重起動はconcurrency直列化＋送信済みガードで1配信のみ。
# データ根拠: 四本値は当日16:30頃公開（公式仕様）＝18時台でも朝ランと同一銘柄。
# 売り禁(margin-alert)の当日公表分だけ18時台は未反映の可能性 → 前日分へ自動フォールバック
# （バッジ/プレミアム料行のみ影響・実測はランのログ「alert_map: <日付> 公表分」で確認）。

on:
  workflow_dispatch:           # Cloudflare Worker `evening-signal-trigger` から叩く本命経路
  schedule:
    - cron: '10 9 * * 1-5'    # 18:10 JST 月-金（保険一段目・遅延込みで19時前後着を狙う）
    - cron: '0 10 * * 1-5'    # 19:00 JST 月-金（保険の二段目）
    - cron: '15 12 * * 1-5'   # 21:15 JST 月-金（保険の三段目。2026-08-27にGitHubが
                              # 全cronを黙ってスキップ＝無発火の夜が実際に起きたため、
                              # 時間帯を大きく離して維持。送信済みガードで二重配信なし）

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_URL }}
      DISCORD_WEBHOOK_BUY_MID_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_MID_URL }}
      DISCORD_WEBHOOK_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_MID_URL }}
      DISCORD_WEBHOOK_BUY_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_SMALL_URL }}
      DISCORD_WEBHOOK_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_SMALL_URL }}
      DISCORD_WEBHOOK_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_URL_PUBLIC }}
      DISCORD_WEBHOOK_SELL_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_SELL_URL_PUBLIC }}
      DISCORD_WEBHOOK_CLOSE_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_CLOSE_URL_PUBLIC }}
      DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC }}
      # 「売買シグナル極み」＝本人専用（shadow_exit.py）。main.py内で通常版と一緒に動く。
      DISCORD_WEBHOOK_SHADOW_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_URL }}
      DISCORD_WEBHOOK_SHADOW_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SMALL_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_URL }}
      # デイトレ売りフェード（main_day.py→daytrade_paper）。この2本が無いと
      # フォールバックでスイング買いチャンネルへ誤爆する作りなので必須。
      DISCORD_WEBHOOK_DAY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_URL }}
      DISCORD_WEBHOOK_URL_DAY: ${{ secrets.DISCORD_WEBHOOK_URL_DAY }}
      # 月次レポート専用ch（2026-08-09・未設定時は各シグナルchへフォールバック）。
      # 月次は月初前夜の21時にこのワークフローから出るので両方必要。
      DISCORD_WEBHOOK_SHADOW_MONTHLY_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MONTHLY_URL }}
      DISCORD_WEBHOOK_DAY_MONTHLY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_MONTHLY_URL }}
      # 友達用フェード（板の厚い玉のみ・2026-08-12・未設定なら無言スキップ）
      DISCORD_WEBHOOK_DAY_FRIENDS_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_FRIENDS_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      NOTE_URL: ${{ secrets.NOTE_URL }}
      EVENING_RUN: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 18:05 JSTまで待つ（着弾≒18:50・19時のハイカラ在庫解禁に合わせる）
        run: |
          # 昼〜18:05の間に起動した場合のみ待機。深夜まで遅延した異常時は
          # 待たずに進み、main.py側の時間ガード(17時未満はスキップ)に任せる。
          NOW=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$NOW" -ge "1200" ] && [ "$NOW" -lt "1805" ]; then
            echo "現在 $NOW JST → 18:05 まで待機"
            while [ "$(TZ=Asia/Tokyo date +%H%M)" -lt "1805" ]; do sleep 60; done
          else
            echo "現在 $NOW JST → 待機なしで実行"
          fi

      - name: 最新の台帳を取り込む（15時の大引けチェック等のコミット反映）
        run: git pull --rebase origin main || true

      - name: スイング前夜配信実行（通常版＋極み）
        run: python main.py

      - name: デイトレ売りフェード前夜配信（2026-08-09追加）
        # main_day.py側のガードで「スイング夜ランが成功した夜だけ」実行される（鮮度ガード相乗り）。
        # ここが失敗しても後段のコミット（スイングの帳簿保存）は止めない＝フェードだけ朝ランに落ちる。
        continue-on-error: true
        run: python main_day.py

      - name: ポジション・シグナル保存（朝ランと同一リスト）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          for f in \
            positions.json positions_sell.json \
            positions_mid.json positions_sell_mid.json \
            positions_small.json positions_sell_small.json \
            today_signals.json today_sell_signals.json today_signals_kiwami.json \
            today_signals_mid.json today_sell_signals_mid.json \
            today_signals_small.json today_sell_signals_small.json \
            day_signals.json last_day_run.json positions_day_paper.json friends_fade.json \
            shadow_exit_main.json shadow_exit_mid.json shadow_exit_small.json \
            kiwami_sell.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: evening signals + positions [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push retry $i"; sleep 5
          done
          echo "push failed after 3 retries"; exit 1
