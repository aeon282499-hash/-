name: 決算カレンダー週次更新

# 毎週金曜に earnings_calendar.json を再生成して push
# 2026-05-21 追加: 本番の決算除外フィルタ用カレンダーを最新化
# 2026-08-09 前倒し(21:00→11:17 JST): 金曜夜のシグナル前夜配信(20:00)より前に
# 最新カレンダーを確定させるため。ビルド窓は END_DATE=昨日(UTC)＝木曜までなので
# 実行を昼に早めても生成物は21:00実行と同一。19時台指定にしないのは GitHub cron の
# 遅延が実測40〜50分・最悪3h45m あり20:00に間に合わない日が出るため
# （11:17指定なら最悪遅延でも15時台に完了。ビルド自体は約25分）。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 5'  # 金曜 2:17 UTC = 11:17 JST（毎時0分はGitHub混雑帯なので回避）

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 決算カレンダー生成（過去4年+1ヶ月）
        run: |
          # 開始日は固定（2022-01-01）、終了日は前日
          END_DATE=$(date -u -d 'yesterday' +%Y-%m-%d)
          python -u build_earnings_calendar.py 2022-01-01 "$END_DATE"

      - name: 未来決算予想日を追加（過去パターンから±90日推定）
        run: python -u predict_next_earnings.py

      # 決算ボラ(earnings_vol.json)の再生成は update_earnings_vol.yml に分離した。
      # 理由: CIにはローカルpklが無いのでJ-Quantsから5年ぶん(約1,220営業日)取ることになり、
      # 単独で20〜40分かかる。このjobのtimeout-minutes=60はカレンダー生成で既にほぼ埋まるため、
      # 同居させると continue-on-error で «黙って失敗し続ける» 形になっていた。

      - name: 差分があればコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earnings_calendar.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update earnings_calendar.json [skip ci]"
            git pull --rebase
            git push
          fi
