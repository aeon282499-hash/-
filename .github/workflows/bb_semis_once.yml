# 一回限り: BB40を半導体大型8銘柄に当てる（売り・買い）（2026-11-23）。
name: BB40 半導体8銘柄（一回限り）

on:
  push:
    branches: [claude/new-session-pe26yi]
    paths:
      - kabuai/bb_semis_1123.py
      - .github/workflows/bb_semis_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_VERIFY_SSL: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r kabuai/requirements.txt
      - name: 前向き検証
        working-directory: kabuai
        run: |
          mkdir -p ../results_bb_semis
          python -X utf8 bb_semis_1123.py 2>&1 | tee ../results_bb_semis/log.txt
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_bb_semis || true
          git commit -m "results: BB40 半導体8銘柄 [skip ci]" || echo "変更なし"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
