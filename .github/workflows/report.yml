name: 夕方の結果レポート

on:
  schedule:
    - cron: '40 6 * * 1-5'   # 15:40 JST (06:40 UTC)
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 結果レポートを送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_URL }}
          DISCORD_WEBHOOK_BUY_MID_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_MID_URL }}
          DISCORD_WEBHOOK_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_MID_URL }}
          DISCORD_WEBHOOK_BUY_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_SMALL_URL }}
          DISCORD_WEBHOOK_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_SMALL_URL }}
          DISCORD_WEBHOOK_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_URL_PUBLIC }}
          DISCORD_WEBHOOK_SELL_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_SELL_URL_PUBLIC }}
          DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC }}
          # 極みの週次（2026-08-09追加）。これが無くて7/31・8/7の週次が
          # 「DISCORD_WEBHOOK_SHADOW_URL 未設定→スキップ」で2週連続欠落していた。
          # WEEKLY未設定時はSHADOW_URL(買いch)へフォールバックする実装なので両方渡す。
          DISCORD_WEBHOOK_SHADOW_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_URL }}
          DISCORD_WEBHOOK_SHADOW_WEEKLY_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_WEEKLY_URL }}
          DISCORD_WEBHOOK_SHADOW_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MID_URL }}
          DISCORD_WEBHOOK_SHADOW_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SMALL_URL }}
          DISCORD_WEBHOOK_SHADOW_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_URL }}
          DISCORD_WEBHOOK_SHADOW_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_MID_URL }}
          DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python report.py

      - name: 取引履歴を保存（3階層分の trade_history をコミット）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add \
            trade_history.json trade_history_sell.json \
            trade_history_mid.json trade_history_sell_mid.json \
            trade_history_small.json trade_history_sell_small.json \
            last_report_run.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update trade_history (3 tiers) [skip ci]"
          # 8/7(金)に他workflowのpushと競合し1発pushが non-fast-forward で失敗
          # →run全体がfailureになりtrade_historyコミットが消えた。他workflowと同じ保険を入れる。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push retry $i"; sleep 5
          done
          echo "push failed after 3 retries"; exit 1
