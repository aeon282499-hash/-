name: スイングシグナル配信

on:
  workflow_dispatch:           # Cloudflare Workerから起動（毎朝8:05 JST）
  schedule:
    - cron: '20 23 * * 0-4'   # バックアップ: 8:20 JST（Cloudflare失敗時の保険）

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── 投げ売りブースター(A/B検証)は2026-07-26に停止（本人指示）──
  # 18日で確定1件・投げ売り日0件＝A/Bの母数が集まらず、配信も金曜に多重発火していた。
  # 再開する場合はこの trigger-capit ジョブと schedule_capitulation*.yml の cron を戻す。

  # ── ギャップフェード: 確実発火経路へ接続（2026-08-01） ──
  # gapfade.yml のGitHub cronは実測で毎日3時間以上遅れる。日別の初回起動を調べると
  #   7/27 13:10❌ / 7/28 12:43(entry2分前) / 7/29 12:46❌ / 7/30 07:14✅ / 7/31 07:28✅
  # ＝5営業日のうち2日はエントリー12:45に間に合っていなかった。
  # このworkflowはCloudflare Worker経由で毎朝8:05きっかりに起動する実績があるので、
  # そこから相乗りでdispatchする（本人のWorker追加登録なしで恒久化できる）。
  # ただし8:05は寄り前でギャップが未確定なので、寄り後まで待ってから叩く。
  # 待ちはpublicリポジトリのActions（分数無制限）で吸収する。
  # gapfade.py側に同日ガードがあるので、既存cronと二重に起動しても配信は1回だけ。
  trigger-gapfade:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    permissions:
      actions: write
    steps:
      - name: 寄り後(9:30 JST)まで待つ
        run: |
          # 9:30 JST = 0:30 UTC。ただし本トリガーは 8:05 JST = **前日** 23:05 UTC に来るので、
          # 「今日の0:30 UTC」だと過去になり待機ゼロで寄り前に叩いてしまう（実際に踏んだ）。
          # 次に来る 0:30 UTC を目標にする。
          NOW=$(date -u +%s)
          TARGET=$(date -u -d 'today 00:30' +%s)
          [ "$TARGET" -le "$NOW" ] && TARGET=$(date -u -d 'tomorrow 00:30' +%s)
          WAIT=$(( TARGET - NOW ))
          echo "現在 $(date -u +'%m/%d %H:%M') UTC / 目標 $(date -u -d "@$TARGET" +'%m/%d %H:%M') UTC (=9:30 JST)"
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 14400 ]; then
            echo "${WAIT}秒 待機"
            sleep "$WAIT"
          else
            # 4時間を超える待ちは想定外の起動時刻＝待たずに進む（既存cronの保険が効く）
            echo "待機スキップ（WAIT=${WAIT}秒＝想定外）"
          fi
      - name: ギャップフェード配信をdispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gapfade.yml --repo "${{ github.repository }}" --ref main

  # ── 決算持ち越し: 朝の売り忘れ防止リマインダー（2026-07-10・独立ジョブ＝本番配信は無傷） ──
  # 昨日大引けで買った建玉を「今日の寄り成行で売る」確認を各階層チャンネルへ。建玉ゼロなら無送信。
  earnings-reminder:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_EARNINGS_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_URL }}
      DISCORD_WEBHOOK_EARNINGS_MID_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_MID_URL }}
      DISCORD_WEBHOOK_EARNINGS_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_SMALL_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 売り忘れリマインダー送信
        run: python main_earnings_hold.py --remind

      - name: リマインダー記録コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # 存在するファイルだけ add（1つでも欠けると git add 全体が fatal になり
          # 後続の pull --rebase が「unstaged changes」で落ちる・2026-07-28に実際に発生）
          for f in positions_earnings.json positions_earnings_mid.json positions_earnings_small.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: update earnings reminder marker [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push retry $i"; sleep 5
          done

  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # today_signals.json / positions.json のpushに必要
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_URL }}
      DISCORD_WEBHOOK_BUY_MID_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_MID_URL }}
      DISCORD_WEBHOOK_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_MID_URL }}
      DISCORD_WEBHOOK_BUY_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_SMALL_URL }}
      DISCORD_WEBHOOK_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_SMALL_URL }}
      DISCORD_WEBHOOK_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_URL_PUBLIC }}
      DISCORD_WEBHOOK_SELL_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_SELL_URL_PUBLIC }}
      DISCORD_WEBHOOK_CLOSE_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_CLOSE_URL_PUBLIC }}
      DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_MONTHLY_URL_PUBLIC }}
      DISCORD_WEBHOOK_DAY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_URL }}
      DISCORD_WEBHOOK_URL_DAY: ${{ secrets.DISCORD_WEBHOOK_URL_DAY }}
      DISCORD_WEBHOOK_URL_SECTOR_THEME: ${{ secrets.DISCORD_WEBHOOK_URL_SECTOR_THEME }}
      DISCORD_WEBHOOK_URL_SECTOR_THEME_SELL: ${{ secrets.DISCORD_WEBHOOK_URL_SECTOR_THEME_SELL }}
      DISCORD_WEBHOOK_URL_THEME: ${{ secrets.DISCORD_WEBHOOK_URL_THEME }}
      # 「売買シグナル極み」＝本人専用の改善先行版（shadow_exit.py）。未設定なら台帳記録のみで無送信。
      DISCORD_WEBHOOK_SHADOW_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
      NOTE_URL: ${{ secrets.NOTE_URL }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: スイングシグナル配信実行
        run: python main.py

      - name: デイトレv2シグナル配信実行（スイング後すぐ・寄り付き9:00に余裕を持って配信）
        # main.py が失敗しても発火させる（continue-on-error: 通常時のみ実行）
        run: python main_day.py

      - name: セクターマップ月次リフレッシュ (JST月初3日)
        continue-on-error: true
        run: |
          day=$(TZ=Asia/Tokyo date +%d)
          if [ "$day" -le "03" ]; then
            echo "JST $day日: sector33_map.json を /equities/master から再取得"
            python -c "from sector_filter import fetch_sector33_map; fetch_sector33_map(force_refresh=True)"
          else
            echo "JST $day日: 月初ではないのでスキップ"
          fi

      # ── セクターローテ: Discord配信は停止中（2026-07-22 本人指示・main_sector_theme.py
      #    の DISCORD_NOTIFY=False。毎日0件通知が不要なため）。判定とJSON保存だけ継続する。
      #    2026-07-26 本人指示「セクターローテはいらない」を再確認＝配信は停止のまま維持し、
      #    空いた買いチャンネルは出口ボラ正規化の紙並走（shadow_exit.py）が使う。
      #    再開するなら main_sector_theme.py の DISCORD_NOTIFY=True（配信先が影と衝突する点に注意）。
      #    計算ごと止めるなら下3行をコメントアウト。
      - name: スイングセクターローテ判定実行（JSON保存のみ・Discord配信は停止中）
        continue-on-error: true
        run: python main_sector_theme.py

      # ── テーマトラッカーDiscord配信は 2026-06-03 ユーザー指示で停止 ──
      # 再開する場合は下4行のコメントを外すだけ。
      # build_dashboard.py(下の公開ダッシュボード更新)とStreamlitは継続。コード/手動専用ワークフロー(schedule_theme.yml)も残置。
      # - name: テーマトラッカー配信実行（相乗り・Cloudflareトリガーで確実発火）
      #   # 失敗が後段のポジション保存を止めないよう continue-on-error
      #   continue-on-error: true
      #   run: python main_theme.py

      - name: ダッシュボード用スナップショット生成（S/A/B/C + テーマ熱 + 米前夜）
        # 失敗が後段のポジション保存を止めないよう continue-on-error
        continue-on-error: true
        run: python build_dashboard.py

      - name: PEAD専業・紙運用（実弾なし・2026-07-12見送り判定のforward検証）
        # 2026-08-05 本人「決算後に買って利益を積み上げたい」→復活パス=紙運用で稼働
        continue-on-error: true
        run: python main_pead_paper.py

      - name: ポジション保存（スイング3階層分 + デイトレ + セクターローテ）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # 存在するファイルだけを add する（途中で生成失敗したファイルがあっても
          # git add 全体が fatal で止まらないようにする＝未ステージ残り→rebase失敗の連鎖防止）
          for f in \
            positions.json positions_sell.json \
            positions_mid.json positions_sell_mid.json \
            positions_small.json positions_sell_small.json \
            today_signals.json today_sell_signals.json today_signals_kiwami.json \
            today_signals_mid.json today_sell_signals_mid.json \
            today_signals_small.json today_sell_signals_small.json \
            day_signals.json last_day_run.json positions_day_paper.json \
            positions_pead_paper.json \
            today_signals_sector_theme.json sector33_map.json logs/sector_theme_diag.jsonl \
            today_signals_theme.json logs/theme_diag.jsonl \
            shadow_exit_main.json shadow_exit_mid.json shadow_exit_small.json \
            dashboard_data.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: update positions today_signals + day_signals + sector_theme + theme + dashboard [skip ci]"
          # 並走する earnings-reminder ジョブと push が衝突すると1発勝負では落ちる
          # （あちらには2026-07-28の実障害を受けて3回リトライがあるのに、こちらに無かった）。
          # 落ちると当日の紙台帳・ポジション記録のコミットが丸ごと消えるので同じ保険を入れる。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push retry $i"; sleep 5
          done
          echo "push failed after 3 retries"; exit 1
