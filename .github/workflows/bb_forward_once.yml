# 一回限り: GU株のBB上抜け逆張り売りを、ルール決定後の新しい期間（10/23〜）で前向き検証（2026-11-22）。
name: BB売り 前向き検証（一回限り）

on:
  push:
    branches: [claude/new-session-pe26yi]
    paths:
      - kabuai/bb_forward_1122.py
      - .github/workflows/bb_forward_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_VERIFY_SSL: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r kabuai/requirements.txt
      - name: 前向き検証
        working-directory: kabuai
        run: |
          mkdir -p ../results_bb_forward
          python -X utf8 bb_forward_1122.py 2>&1 | tee ../results_bb_forward/log.txt
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_bb_forward || true
          git commit -m "results: BB売り 前向き検証 [skip ci]" || echo "変更なし"
          git push || echo "push失敗"
