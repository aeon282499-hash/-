# 一回限り: BB売りの幅 2σ と 2.07σ（ボリンジャー本人の40本の目安）の比較（2026-11-23）。
name: BB売り 幅2σと2.07σの比較（一回限り）

on:
  push:
    branches: [claude/new-session-pe26yi]
    paths:
      - kabuai/bb_sigma207_check_1123.py
      - .github/workflows/bb_sigma207_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_VERIFY_SSL: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r kabuai/requirements.txt
      - name: 前向き検証
        working-directory: kabuai
        run: |
          mkdir -p ../results_bb_sigma207
          python -X utf8 bb_sigma207_check_1123.py 2>&1 | tee ../results_bb_sigma207/log.txt
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_bb_sigma207 || true
          git commit -m "results: BB売り 幅2.07σ確認 [skip ci]" || echo "変更なし"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
