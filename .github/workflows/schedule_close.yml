name: 大引け前RSI判定

on:
  workflow_dispatch:           # メイン: cron-job.org → Cloudflare Worker(close-signal-trigger) から 14:55 JST にdispatch
  schedule:
    - cron: '0 5 * * 1-5'      # バックアップ: 14:00 JST想定（GitHub cronは1-2h遅延するため大引け15:00に間に合うよう前倒し）
    - cron: '45 6 * * 1-5'     # 確定チェック用: 15:45 JST想定→遅延で16-17時台着弾（送信済み+15:40以降の再実行は場中OCO約定の確定通知に転用・2026-07-23）

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── 投げ売りブースター(A/B検証)は2026-07-26に停止（本人指示・上記schedule.yml参照）──

  # ── 決算持ち越しシグナル（2026-07-10新設・独立ジョブ＝失敗しても大引け判定は無傷） ──
  # JPX予定表更新→ルールA判定→Discord買いリスト配信→positions_earnings.json記帳。
  earnings-hold:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_EARNINGS_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_URL }}
      DISCORD_WEBHOOK_EARNINGS_MID_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_MID_URL }}
      DISCORD_WEBHOOK_EARNINGS_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_EARNINGS_SMALL_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 決算持ち越しシグナル実行
        run: python main_earnings_hold.py

      - name: 記帳コミット（positions_earnings.json / jpx_earnings_schedule.json）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # 存在するファイルだけ add（同上）
          # earnings_vol_rejected.json＝決算ボラ/場中ゲートで弾いた銘柄の記録。
          # コミットしないとrunnerごと消えて「弾かなければどうだったか」を後から検証できない。
          for f in positions_earnings.json positions_earnings_mid.json \
                   positions_earnings_small.json jpx_earnings_schedule.json \
                   earnings_times.json earnings_vol_rejected.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: update earnings hold positions [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push retry $i"; sleep 5
          done

  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # last_close_check.json のpushに必要
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_URL }}
      DISCORD_WEBHOOK_BUY_MID_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_MID_URL }}
      DISCORD_WEBHOOK_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_MID_URL }}
      DISCORD_WEBHOOK_BUY_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_BUY_SMALL_URL }}
      DISCORD_WEBHOOK_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SELL_SMALL_URL }}
      DISCORD_WEBHOOK_CLOSE_URL_PUBLIC: ${{ secrets.DISCORD_WEBHOOK_CLOSE_URL_PUBLIC }}
      DISCORD_WEBHOOK_SHADOW_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_URL }}
      DISCORD_WEBHOOK_SHADOW_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SMALL_URL }}
      DISCORD_WEBHOOK_GOKUJO_URL: ${{ secrets.DISCORD_WEBHOOK_GOKUJO_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_URL }}   # 2026-09-03監査: 欠けていて大の売りchに15時判定が一度も出ていなかった
      DISCORD_WEBHOOK_SHADOW_SELL_MID_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_MID_URL }}
      DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL: ${{ secrets.DISCORD_WEBHOOK_SHADOW_SELL_SMALL_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 最新マーカーを取り込む（多重起動の二重通知ガード・2026-08-09）
        # 8/7に14:55本トリガと遅延バックアップcron(15:04)が並走し、後発のcheckoutが
        # 先発のマーカーpush(15:10)より古くて極みの処分通知が15:09と15:24の2回出た。
        # pip後(=実行直前)にpullすれば先発の送信済みマーカーを拾ってスキップできる。
        run: git pull --rebase origin main || true

      - name: 大引け前チェック実行
        run: python close_check.py

      # ── 「売買シグナル極み」の大引けチェック（2026-07-26）──
      # 極みは損切りが銘柄ごと（ATR連動）なので通常版の一律-3%判定では足りず、専用に実行する。
      # continue-on-error: ここが落ちても上の通常版の配信・マーカー保存は完了済みで無傷。
      - name: 極みの大引けチェック実行
        if: always()          # 2026-09-03監査: 通常版(配信停止中)の close_check が落ちても実弾の極みは必ず回す
        continue-on-error: true
        run: python kiwami_close.py

      - name: マーカー保存（last_close_check.json をコミット）
        if: always()          # 2026-09-04: kiwami_close が always() で走るので、その出力(close_decisions/マーカー)も必ず保存
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # 存在するファイルだけ add する。2026-07-28: kiwami_close_last_run.json を
          # まとめて指定したところ、極みの保有玉がゼロの日はこのファイルが生成されず
          # `fatal: pathspec ... did not match any files` で git add 全体が失敗し、
          # last_close_check.json すら未ステージのまま git pull --rebase が
          # 「You have unstaged changes」で落ちてジョブが exit 128 になっていた
          # （schedule.yml 側は元からこのループ方式で回避していた）。
          for f in last_close_check.json kiwami_close_last_run.json close_decisions.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: update last_close_check [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1
