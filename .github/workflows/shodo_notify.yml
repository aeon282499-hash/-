# 大相場の前兆（初動ブレイク＋立花型出来高理論）のDiscord配信（2026-08-24）
# Pages公開済みの explorer.json を読むだけ＝J-Quants負荷ゼロ・kabuaiビルドに触らない。
# 時刻はGitHub cronの常時40-50分遅延を織り込み済み:
#   夕方便 12:05 UTC = 21:05 JST（kabuai 18:30/19:45便の遅延着弾後・当日EODを配信）
#   朝便   23:55 UTC = 08:55 JST（前夜にEODが間に合わなかった日の拾い直し・7:00朝ビルド後）
# 重複ガード = shodo_last_send.json（配信済みdata_dateをコミット）。
# webhook Secret: DISCORD_WEBHOOK_SHODO_URL（未設定なら無言スキップ＝誤爆なし）
name: 大相場の前兆 配信

on:
  workflow_dispatch:
  schedule:
    - cron: '5 12 * * 1-5'    # 21:05 JST 平日夕
    - cron: '55 22 * * 0-4'   # 08:55 JST 平日朝（前夜の拾い直し）

concurrency:
  group: shodo-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 配信
        env:
          DISCORD_WEBHOOK_SHODO_URL: ${{ secrets.DISCORD_WEBHOOK_SHODO_URL }}
        run: python -X utf8 shodo_notify.py
      - name: マーカーをコミット
        # マーカーは「実際に配信できた時」だけ作られる（webhook未登録の朝はファイル自体が無い）。
        # 存在しないファイルへの git diff は fatal(128) になるので、存在チェックを先に置く。
        run: |
          if [ -f shodo_last_send.json ] && [ -n "$(git status --porcelain shodo_last_send.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shodo_last_send.json
            git commit -m "chore: shodo notify marker [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
