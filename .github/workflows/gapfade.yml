name: ギャップフェード 朝の候補配信

# 当日GU+3〜8%を12:30（後場寄り）に空売り→大引け買戻し（_bt_intraday_grand.py で発見・2026-07-26）。
# 寄り値が要るので EOD ビルドでは出せず、寄り後に専用で取得する。
# 9:15に最初の15分足が確定 → 9:25起動で寄り値が取れる。
#
# 【2026-07-28 多重化】初日7/27は9:25設計に対し **実際の起動が13:10 JST（3時間45分遅延）**＝
# 後場寄り12:30の発注に完全に間に合わなかった（本人「ひるの13時じゃ間に合わん・12時には必ず出して」）。
# 同リポジトリの実測で GitHub cron は常時40〜50分遅れ（8:20設計→9:08〜9:13着弾）、
# 一方 cron-job.org→Cloudflare Worker の workflow_dispatch は毎日8:05きっかり。
# よって (1) 保険cronを4本に増やし (2) 外部トリガー(cron-job.org 11:00 JST)を本命にする。
# gapfade.py 側に同日配信ガード（gapfade_last_send.json）があるので、最初に届いた1本だけが
# 配信し、以降は「配信済み→スキップ」で流れる＝何本叩いても連投しない。
# 【2026-07-29 再設計】上の「40〜50分遅延」という前提が間違っていた。実測すると
# このworkflowのcronは **毎日3時間以上遅れて起動** している:
#   予定 9:25→実12:46 / 10:10→13:25 / 10:50→13:53 / 11:20→14:32（7/28も同じ4本とも3時間超）
# 結果 7/29 は 12:56 に「12:30に撃て」と配信＝26分手遅れの指示を出していた。
# cronの本数を増やしても全部が同じだけずれるので本数では解決しない。
# 対策は2段構え:
#   ①スケジュールを実測遅延ぶん前倒しする（下記・JST 6:20〜9:20 に設定して 9:30〜12:20 着弾を狙う）
#   ②それでも外したときに備え gapfade.py 側に時刻ガードを入れた（2026-07-29）:
#     9:20 JST未満 = 寄り値前 → 何も送らず終了（同日ガードを消費しない）
#     12:20 JST超  = エントリー時刻超過 → 「撃て」ではなく「遅延・本日見送り」として配信
# **恒久解は cron-job.org → Cloudflare Worker → workflow_dispatch**（他システムでは毎日
# 8:05きっかりに着弾する実績あり）。本人のWorker登録が済めば下のcronは保険に格下げでよい。
on:
  schedule:
    - cron: '20 21 * * 0-4'     # 21:20 UTC = 翌6:20 JST（+3h15m遅延で 9:35 着を狙う本命）
    - cron: '30 22 * * 0-4'     # 22:30 UTC = 翌7:30 JST（保険1・遅延で10:45頃）
    - cron: '30 23 * * 0-4'     # 23:30 UTC = 翌8:30 JST（保険2・遅延で11:45頃）
    - cron: '20 0 * * 1-5'      # 00:20 UTC =   9:20 JST（保険3・遅延しなければ即着／遅延で12:35→late通知）
  workflow_dispatch:

permissions:
  contents: write               # gapfade_ledger.json のコミットに必要

concurrency:
  group: ${{ github.workflow }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 依存関係
        run: pip install -q pandas numpy requests python-dotenv
      - name: 候補生成＋前日分の答え合わせ＋配信
        env:
          DISCORD_WEBHOOK_GAPFADE_URL: ${{ secrets.DISCORD_WEBHOOK_GAPFADE_URL }}
          DISCORD_WEBHOOK_DAY_URL: ${{ secrets.DISCORD_WEBHOOK_DAY_URL }}
          DISCORD_WEBHOOK_URL_DAY: ${{ secrets.DISCORD_WEBHOOK_URL_DAY }}
          # 貸借区分の取得に必要（2026-08-04・_iss_type_by_year.pklはgit外でCIに無い＝
          # これが無いと全銘柄が貸借×扱いになり毎日「該当なし」に偽装される実バグがあった）
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -X utf8 gapfade.py
      - name: 台帳を保存
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          for f in gapfade_ledger.json gapfade_last_send.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "chore(gapfade): update ledger [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
