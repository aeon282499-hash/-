# アドホック配信（2026-08-15新設）: 任意のテキストを指定チャンネルへ1回だけ送る手動専用ワークフロー。
# 用途=「配信しといて」系の単発連絡。ローカル.envのwebhookは古い/別チャンネルを向いている前科がある
# （実例: DISCORD_WEBHOOK_DAY_URLのローカル値が友達chを向いていた）ため、正はGitHub Secrets＝ここ経由で送る。
# 定期配信・シグナル系には一切影響しない（どのスケジュールにも載らない・workflow_dispatch専用）。
name: アドホック配信（手動）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '宛先: day=俺専用デイトレ / day_monthly=フェード月次 / main=スイング大'
        required: true
        default: 'day'
        type: choice
        options: [day, day_monthly, main]
      title:
        description: 'embedタイトル'
        required: true
        type: string
      body:
        description: 'embed本文（Markdown・4096字まで）'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 送信
        env:
          HOOK_DAY: ${{ secrets.DISCORD_WEBHOOK_DAY_URL }}
          HOOK_DAY_MONTHLY: ${{ secrets.DISCORD_WEBHOOK_DAY_MONTHLY_URL }}
          HOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CH: ${{ inputs.channel }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request
          hooks = {"day": os.environ.get("HOOK_DAY", ""),
                   "day_monthly": os.environ.get("HOOK_DAY_MONTHLY", ""),
                   "main": os.environ.get("HOOK_MAIN", "")}
          url = hooks.get(os.environ["CH"], "").strip()
          if not url:
              raise SystemExit(f"webhook未設定: {os.environ['CH']}")
          payload = {"embeds": [{"title": os.environ["TITLE"][:256],
                                 "description": os.environ["BODY"][:4096],
                                 "color": 0xF0B90B}]}
          req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"),
                                       headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as r:
              print("HTTP", r.status)
          PYEOF
