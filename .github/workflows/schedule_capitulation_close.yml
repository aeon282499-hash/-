name: 投げ売りブースター大引けチェック（A/Bテスト）

# 案A検証口座の15:00大引けチェック（処分/保有）＋金曜はA/B比較レポート。
# 本番 schedule_close.yml とは完全独立。
# 確実発火(2026-07-09〜): schedule_close.yml の trigger-capit-close ジョブが14:55 JSTにdispatch
# （cron-job.org→Cloudflare Worker経路に相乗り）。下のcronはGitHub側の保険。
on:
  workflow_dispatch:
  # schedule: 2026-07-26に停止（本人指示）。再開は下のcronを戻す
  #  - cron: '58 5 * * 1-5'

concurrency:
  group: capitulation-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_TEST_URL: ${{ secrets.DISCORD_WEBHOOK_TEST_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      CAPIT_THRESHOLD: ${{ vars.CAPIT_THRESHOLD }}
      CAPIT_BOOST: ${{ vars.CAPIT_BOOST }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: 大引けチェック実行
        run: python capitulation.py close

      # A/B比較レポートの配信は2026-07-26に停止（本人指示）。
      # 同日ガードが close にしか無く、3経路(自前cron/schedule_closeのdispatch/保険)から
      # 起動されるため金曜に最大4連投していた。再開時はガードも一緒に入れること。
      - name: テスト用ポジション保存
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          for f in positions_test.json last_close_check_test.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore(capit): update test positions (close) [skip ci]"
          # 本番schedule_close.ymlと同時刻に走るため push 衝突をリトライで吸収
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push衝突 → リトライ ($i/3)"; sleep 15
          done
          echo "push失敗（3回試行）"; exit 1
